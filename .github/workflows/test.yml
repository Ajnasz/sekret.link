name: Run tests

on: push

jobs:

  container-job:
    name: Test
    runs-on: ubuntu-latest

    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sekret_link_test
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@v5
      with:
        go-version: "1.27"
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get dependencies
      run: |
        go get -v -t -d ./...
        if [ -f Gopkg.toml ]; then
            curl https://raw.githubusercontent.com/golang/dep/master/install.sh | sh
            dep ensure
        fi

    - name: Test
      env:
        POSTGRES_URL: "postgres://postgres:password@localhost:5432/sekret_link_test?sslmode=disable"
      run: make test

    - name: Install hurl
      run: |
        curl -LO https://github.com/Orange-OpenSource/hurl/releases/download/8.0.1/hurl_8.0.1_amd64.deb
        sudo dpkg -i hurl_8.0.1_amd64.deb

    - name: Prepare e2e test database
      env:
        POSTGRES_URL: "postgres://postgres:password@localhost:5432/sekret_link_test?sslmode=disable"
      run: make dbcreate-test

    - name: Start server for e2e tests
      env:
        POSTGRES_URL: "postgres://postgres:password@localhost:5432/sekret_link_test?sslmode=disable"
      run: |
        go run ./cmd/sekret.link -webExternalURL=http://localhost:8080/api -corsOrigins="https://acheron.space" &
        for i in $(seq 1 30); do
          nc -z localhost 8080 && exit 0
          sleep 1
        done
        echo "server did not become ready in time" >&2
        exit 1

    - name: Run e2e tests
      run: make hurl
